<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Majordomo · Панель</title>
<!--
  Lovelace — панель управления для модуля MajorDoMo lovelace.
  Vanilla JS, без сборки и внешних CDN. Открывается в iframe страницы модуля
  (lovelace.html) или напрямую; киоск-режим — index.html?token=<токен>.
  API: api.php/module/lovelace/<op>. Карточки — плагины из cards/index.json.
  Если API недоступен — показываются демо-данные. Подробнее — README.md.
-->
<style>
  :root{
    --bg:#10131a; --surface:#191d27; --raised:#222736; --border:#2b3040;
    --text:#e6e9f0; --muted:#8b93a7; --faint:#5b6377;
    --active:#ffb454;            /* тёплый «включено» */
    --active-soft:#ffb45422;
    --on-active:#10131a;         /* текст на акцентном фоне */
    --link:#5ec8d8;              /* холодный интерактив */
    --ok:#5fd08a; --bad:#ef6f6f;
    --r:16px; --r-sm:11px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  /* ---- темы (переключаются data-theme на <html>) ---- */
  :root[data-theme="light"]{
    --bg:#f4f6f9; --surface:#ffffff; --raised:#eceff4; --border:#dbe0e8;
    --text:#1e2430; --muted:#5b6472; --faint:#97a0b0;
    --active:#e8961f; --active-soft:#e8961f22; --on-active:#241500;
    --link:#1f8aa0; --ok:#2e9e5b; --bad:#d64545;
  }
  :root[data-theme="midnight"]{
    --bg:#0d1120; --surface:#151a2e; --raised:#1f263f; --border:#2b3350;
    --text:#e4e8f5; --muted:#8b94b5; --faint:#5a6288;
    --active:#8b7cff; --active-soft:#8b7cff22; --on-active:#0d1120;
    --link:#6ea8ff; --ok:#5fd08a; --bad:#ef6f6f;
  }
  :root[data-theme="ocean"]{
    --bg:#0a1719; --surface:#112427; --raised:#183238; --border:#234a50;
    --text:#dff0f0; --muted:#7fa5a8; --faint:#4e7176;
    --active:#2fd8c3; --active-soft:#2fd8c322; --on-active:#062024;
    --link:#5ec8d8; --ok:#5fd08a; --bad:#ef6f6f;
  }
  :root[data-theme="forest"]{
    --bg:#0c1410; --surface:#12201a; --raised:#1b2e24; --border:#274236;
    --text:#dfeee6; --muted:#83a394; --faint:#527266;
    --active:#4fd18a; --active-soft:#4fd18a22; --on-active:#06140d;
    --link:#5ec8d8; --ok:#5fd08a; --bad:#ef6f6f;
  }
  :root[data-theme="sunset"]{
    --bg:#160f0f; --surface:#241919; --raised:#33231f; --border:#4a332c;
    --text:#f2e4df; --muted:#b59289; --faint:#7a564c;
    --active:#ff7a45; --active-soft:#ff7a4522; --on-active:#1a0d07;
    --link:#ffb454; --ok:#5fd08a; --bad:#ef6f6f;
  }
  :root[data-theme="grape"]{
    --bg:#120e1c; --surface:#1c1730; --raised:#282041; --border:#3a3059;
    --text:#e9e3f7; --muted:#a294c4; --faint:#6b5f8c;
    --active:#c07cff; --active-soft:#c07cff22; --on-active:#120a1e;
    --link:#8b7cff; --ok:#5fd08a; --bad:#ef6f6f;
  }
  :root[data-theme="paper"]{
    --bg:#f3efe6; --surface:#fffdf8; --raised:#ece6d8; --border:#dcd3c0;
    --text:#2c2519; --muted:#6b5f4c; --faint:#a99c84;
    --active:#c8791e; --active-soft:#c8791e22; --on-active:#241500;
    --link:#1f7a8a; --ok:#2e9e5b; --bad:#c0432e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* тонкие ненавязчивые полосы прокрутки */
  html{scrollbar-width:thin; scrollbar-color:var(--border) transparent}
  ::-webkit-scrollbar{width:7px; height:7px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px; border:2px solid transparent; background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint); background-clip:padding-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.4;
    padding:0 0 env(safe-area-inset-bottom);
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- шапка ---- */
  header{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px calc(14px + env(safe-area-inset-top,0)) 16px;
    padding-top:max(14px,env(safe-area-inset-top,0));
    background:linear-gradient(180deg,var(--bg) 70%,transparent);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex; align-items:baseline; gap:9px; min-width:0}
  .brand b{font-size:17px; font-weight:650; letter-spacing:.2px}
  .brand span{font-size:12px; color:var(--faint)}
  .spacer{flex:1}
  .heart{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted)}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--faint); flex:none}
  .dot.live{background:var(--ok); box-shadow:0 0 0 0 var(--ok); animation:pulse 2.4s infinite}
  .dot.ws{background:var(--link); box-shadow:0 0 0 0 var(--link); animation:pulse-ws 2.4s infinite}
  .dot.stale{background:var(--bad)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #5fd08a66}70%{box-shadow:0 0 0 7px #5fd08a00}100%{box-shadow:0 0 0 0 #5fd08a00}}
  @keyframes pulse-ws{0%{box-shadow:0 0 0 0 #5ec8d866}70%{box-shadow:0 0 0 7px #5ec8d800}100%{box-shadow:0 0 0 0 #5ec8d800}}
  .iconbtn{
    background:var(--raised); border:1px solid var(--border); color:var(--text);
    width:38px; height:38px; border-radius:11px; cursor:pointer; flex:none;
    display:grid; place-items:center; transition:.15s;
  }
  .iconbtn:hover{border-color:var(--faint)}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn svg{width:19px; height:19px}
  .iconbtn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .banner{
    margin:0 16px 4px; padding:10px 13px; border-radius:var(--r-sm);
    background:#3a2f1a; border:1px solid #6b5320; color:#f0d9a8; font-size:13px;
    display:none;
  }
  .banner.show{display:block}
  #app.demo{filter:blur(3px) grayscale(.35); opacity:.7; pointer-events:none; user-select:none; transition:filter .2s}
  #toasts{position:fixed; right:12px; bottom:12px; z-index:9000; display:flex; flex-direction:column; gap:8px; max-width:min(360px,86vw); pointer-events:none}
  .toast{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--active); border-radius:10px; padding:10px 12px; box-shadow:0 6px 20px rgba(0,0,0,.35); color:var(--text); font-size:13px; line-height:1.35; opacity:0; transform:translateY(8px); transition:opacity .2s,transform .2s; pointer-events:auto}
  .toast.show{opacity:1; transform:translateY(0)}
  .toast .t-head{display:flex; justify-content:space-between; gap:8px; margin-bottom:2px}
  .toast .t-who{font-weight:600; color:var(--active)}
  .toast .t-time{color:var(--muted,#8a92a6); font-size:11px; flex:0 0 auto}
  .toast .t-text{word-break:break-word}
  .bell-badge{position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 4px; box-sizing:border-box; background:var(--active); color:var(--on-active,#fff); font-size:10px; line-height:16px; text-align:center; border-radius:8px; font-weight:700}
  #chatModal{position:fixed; inset:0; z-index:8500; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center}
  #chatModal.show{display:flex}
  .chat-box{background:var(--surface); width:min(560px,100%); max-height:80vh; border:1px solid var(--border); border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden}
  @media(min-width:600px){ #chatModal{align-items:center} .chat-box{border-radius:16px} }
  .chat-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border)}
  .chat-head b{font-size:15px}
  .chat-close{background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; line-height:1}
  .chat-list{flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:8px}
  .chat-msg{font-size:13px; line-height:1.4}
  .chat-msg .cm-head{font-size:11px; color:var(--muted); margin-bottom:1px}
  .chat-msg .cm-who{color:var(--active); font-weight:600}
  .chat-empty{color:var(--muted); text-align:center; padding:20px}
  .chat-input{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--border)}
  .chat-input input{flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px 12px; font:inherit; font-size:14px}
  .chat-input button{background:var(--active); color:var(--on-active,#fff); border:0; border-radius:10px; padding:0 16px; font:inherit; font-weight:600; cursor:pointer}

  /* ---- меню тем ---- */
  .thememenu{
    position:fixed; z-index:20; right:12px; top:56px; display:none;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:6px; box-shadow:0 10px 30px -12px #000a; min-width:170px;
  }
  .thememenu.show{display:block}
  .tm-item{
    display:flex; align-items:center; gap:10px; width:100%; padding:8px 9px; border-radius:9px;
    border:1px solid transparent; background:transparent; color:var(--text); font:inherit; font-size:13px;
    cursor:pointer; text-align:left;
  }
  .tm-item:hover{background:var(--raised)}
  .tm-item.active{border-color:var(--active)}
  .tm-sw{width:22px; height:22px; border-radius:7px; border:1px solid var(--border); flex:none;
    display:grid; place-items:center}
  .tm-sw i{width:9px; height:9px; border-radius:50%; display:block}

  /* ---- вкладки комнат (мобильная навигация) ---- */
  .tabs{
    position:sticky; top:0; z-index:9;
    display:flex; gap:7px; overflow-x:auto; scrollbar-width:none;
    padding:8px 12px; background:linear-gradient(180deg,var(--bg) 80%,transparent);
    -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs:empty{display:none}
  .tab{
    flex:none; padding:7px 14px; border-radius:999px; cursor:pointer; white-space:nowrap;
    font-size:13px; color:var(--muted); background:var(--surface);
    border:1px solid var(--border); transition:.15s; -webkit-tap-highlight-color:transparent;
  }
  .tab:active{transform:scale(.96)}
  .tab.active{color:var(--on-active); background:var(--active); border-color:var(--active); font-weight:600}

  main{padding:6px 12px 40px; max-width:1100px; margin:0 auto}

  /* ---- секция комнаты ---- */
  .room{margin:18px 4px 6px}
  .room h2{
    font-size:12px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--faint); margin:0 0 10px 2px;
  }
  .grid{
    display:grid; gap:11px;
    grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
  }
  .card.w2{grid-column:span 2}
  .card.w3{grid-column:span 3}
  .card.w4{grid-column:span 4}
  .card.wfull{grid-column:1/-1}
  .card.spacer{grid-column:auto/-1; height:0; min-height:0; background:transparent; border-color:transparent; box-shadow:none; padding:0; align-self:start; pointer-events:none}
  .card.tall{min-height:210px}
  .card.xtall{min-height:300px}
  .card.tall .ctrls,.card.xtall .ctrls{flex:1}

  /* ---- карточка устройства ---- */
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r); padding:14px; position:relative; overflow:hidden;
    transition:border-color .2s, box-shadow .3s;
  }
  .card.on{
    border-color:#4a3d22;
    box-shadow:inset 0 0 0 1px #ffb4541a, 0 0 22px -12px var(--active);
  }
  .card.on::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120px 60px at 22px 22px,var(--active-soft),transparent 70%);
  }
  .card-top{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px}
  .card-top.no-obj{align-items:center}
  .ico{
    width:34px; height:34px; border-radius:10px; flex:none;
    display:grid; place-items:center; background:var(--raised); color:var(--muted);
    transition:.2s;
  }
  .card.on .ico{background:var(--active-soft); color:var(--active)}
  .ico svg{width:19px; height:19px}
  .titles{min-width:0; flex:1}
  .titles .t{font-size:14px; font-weight:560; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .titles .s{font-size:11.5px; color:var(--muted); margin-top:2px}

  .ctrls{display:flex; flex-direction:column; gap:11px}
  .ctrl-label{font-size:11px; color:var(--muted); margin-bottom:5px}

  /* стили карточек — в их файлах cards/*.js (инъекция через Lovelace.util.css) */

  /* ---- модалка графика ---- */
  .cmodal{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    padding:16px; background:rgba(0,0,0,.62)}
  .cmodal.show{display:flex}
  .cmodal-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    width:100%; max-width:720px; height:min(80vh,560px); display:flex; flex-direction:column; overflow:hidden}
  .cmodal-head{display:flex; align-items:center; gap:8px; padding:11px 12px; border-bottom:1px solid var(--border)}
  .cmodal-title{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .cmodal-ranges{display:flex; gap:5px; flex:none}
  .crange{padding:5px 10px; border-radius:999px; font-size:12px; cursor:pointer; color:var(--muted);
    background:var(--raised); border:1px solid var(--border)}
  .crange.active{color:var(--on-active); background:var(--active); border-color:var(--active); font-weight:600}
  .cmodal-close{width:32px; height:32px; border-radius:8px; background:var(--raised); border:1px solid var(--border);
    color:var(--text); cursor:pointer; display:grid; place-items:center; flex:none}
  .cmodal-body{flex:1; background:#fff}
  .cmodal-body iframe{width:100%; height:100%; border:0; display:block; background:#fff}

  /* ---- инфо об устройстве ---- */
  #cardinfo{z-index:45}
  .ci-boxsize{height:auto; max-height:80vh}
  .ci-body{overflow-y:auto; padding:10px 12px 16px}
  .ci-sub{font-family:var(--mono); font-size:11.5px; color:var(--faint); padding:2px 2px 8px}
  .ci-row{display:flex; align-items:baseline; gap:12px; padding:9px 6px; border-bottom:1px solid var(--border)}
  .ci-row:last-child{border-bottom:0}
  .ci-name{flex:1 1 42%; min-width:0; font-size:13px; color:var(--muted); overflow-wrap:anywhere}
  .ci-val{flex:1 1 58%; min-width:0; font-family:var(--mono); font-size:13px; color:var(--text); text-align:right; overflow-wrap:anywhere}
  .ci-chart{width:30px; height:30px; flex:none; border-radius:8px; border:1px solid var(--border);
    background:var(--raised); color:var(--muted); cursor:pointer; display:grid; place-items:center}
  .ci-chart:hover{color:var(--active); border-color:var(--faint)}
  .ci-chart svg{width:15px; height:15px}
  .card-top[data-info]{cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; transition:opacity .12s}
  .card-top[data-info]:active{opacity:.6}
  .card-i{margin-left:auto; flex:none; align-self:flex-start; color:var(--faint); display:grid; place-items:center; width:20px; height:20px}
  .card-alive{margin-left:auto; flex:none; align-self:flex-start; width:9px; height:9px; border-radius:50%; margin-top:3px}
  .card-alive.on{background:#2f9e69}
  .card-alive.off{background:#c23b3f}
  .card-i svg{width:16px; height:16px}
  .card-top[data-info]:hover .card-i{color:var(--active)}

  /* ---- погода: стили в внешнем плагине cards/weather.js ---- */

  /* ---- webrtc камера ---- */
  .rtc{position:relative; border-radius:10px; overflow:hidden; background:#000; aspect-ratio:16/9; display:flex; cursor:pointer}
  .rtc img{width:100%; height:100%; object-fit:cover; display:block}
  .rtc-play{position:absolute; inset:0; margin:auto; width:46px; height:46px; border-radius:50%;
    background:rgba(0,0,0,.45); display:grid; place-items:center; color:#fff; pointer-events:none}
  .rtc-play svg{width:22px; height:22px; margin-left:3px}
  #webrtc .cmodal-body,#webrtc iframe{background:#000}

  /* ---- редактор ---- */
  .editor{position:fixed; inset:0; z-index:60; background:var(--bg); display:none; flex-direction:column}
  .editor.show{display:flex}
  .ed-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); flex-wrap:nowrap;
    padding-top:max(14px,env(safe-area-inset-top,0))}
  .ed-head b{font-size:16px; flex:none; white-space:nowrap}
  .ed-actions{display:flex; align-items:center; gap:8px; flex:1 1 0; min-width:0; overflow-x:auto; justify-content:flex-start;
    -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .ed-actions::-webkit-scrollbar{display:none}
  .ed-btn{padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:var(--raised);
    color:var(--text); font:inherit; font-size:13px; cursor:pointer; flex:none; white-space:nowrap}
  .ed-btn:active{transform:scale(.97)}
  .ed-primary{background:var(--active); border-color:var(--active); color:var(--on-active); font-weight:600}
  .ed-body{flex:1; overflow-y:auto; padding:14px 12px 40px; max-width:900px; margin:0 auto; width:100%}

  .ed-room{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px; margin-bottom:14px}
  .ed-bar{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
  .ed-barsp{flex:1}
  .ed-rooms{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:8px; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; -ms-overflow-style:none}
  .ed-rooms::-webkit-scrollbar{display:none; width:0; height:0}
  .ed-rchip{flex:none; padding:7px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg);
    color:var(--muted); font:inherit; font-size:13px; cursor:pointer; white-space:nowrap}
  .ed-rchip.active{background:var(--active); border-color:var(--active); color:var(--on-active); font-weight:600}
  .ed-titlebar{margin-bottom:12px}
  .ed-titlebar label{display:block; font-size:11px; color:var(--muted); margin-bottom:4px}
  .ed-userSel{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:9px 10px; font:inherit; font-size:13px; box-sizing:border-box; margin-bottom:2px}
  .ed-bar #ed-roomsel{flex:1 1 140px}
  .ed-titlebar .ed-check{display:flex; align-items:center; gap:8px; margin:10px 0 0; font-size:13px; color:var(--text); cursor:pointer; user-select:none}
  .ed-titlebar .ed-check input{width:17px; height:17px; margin:0; flex:none; accent-color:var(--active); cursor:pointer}
  .ed-tokens{margin-top:16px; border-top:1px solid var(--border); padding-top:12px}
  .ed-tk-h{font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px}
  .ed-tk-item{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); flex-wrap:wrap}
  .ed-tk-info{flex:1; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .ed-tk-info b{font-size:13px}
  .ed-tk-badge{font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600}
  .ed-tk-badge.ctrl{background:var(--active-soft); color:var(--active)}
  .ed-tk-badge.view{background:var(--raised); color:var(--muted)}
  .ed-tk-seen{font-size:11px; color:var(--faint)}
  .ed-tk-act{display:flex; gap:6px; flex:none}
  .ed-tk-empty{font-size:12px; color:var(--muted); padding:6px 0}
  .ed-tk-new{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .ed-tk-new input[type=text],.ed-tk-new #ed-tk-title{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:9px 10px; font:inherit; font-size:13px; box-sizing:border-box}
  .ed-tk-link{font-size:12px; color:var(--muted); background:var(--raised); border-radius:9px; padding:9px 10px}
  .ed-tk-url{font-family:var(--mono); font-size:11px; color:var(--text); word-break:break-all}
  .ed-move{margin-top:8px}
  .ed-move .ed-moveto{width:100%; color:var(--muted)}
  .ed-room-head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .ed-room-head input{flex:1}
  .ed-mini{width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--raised);
    color:var(--text); cursor:pointer; font-size:14px; flex:none; line-height:1; display:grid; place-items:center}
  .ed-mini:active{transform:scale(.92)}
  .ed-mini.del{color:var(--bad)}
  .ed-mini:disabled{opacity:.4; cursor:default; transform:none}
  .ed-mini svg{width:15px; height:15px}

  .ed-card{background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:10px; margin-bottom:9px}

  .ed-card-top .ed-obj{flex:1}
  .ed-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px}
  .ed-field label{display:block; font-size:11px; color:var(--muted); margin-bottom:3px}
  .ed-seg{display:flex; gap:4px; flex-wrap:wrap}
  .ed-multi{display:flex; gap:4px; flex-wrap:wrap}
  .ed-multi .ed-segbtn{flex:0 0 auto; padding:7px 10px}
  .ed-segbtn{flex:1; min-width:34px; padding:8px 4px; border-radius:8px; cursor:pointer;
    border:1px solid var(--border); background:var(--bg); color:var(--muted); font:inherit; font-size:12px}
  .ed-segbtn.active{background:var(--active); border-color:var(--active); color:var(--on-active); font-weight:600}
  .ed-segbtn:active{transform:scale(.94)}
  .editor input,.editor select{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 9px; font:inherit; font-size:13px}
  .ed-room > .ed-add{margin-top:4px}
  .ed-add{width:100%; padding:9px; border-radius:10px; border:1px dashed var(--faint); background:transparent;
    color:var(--link); font:inherit; font-size:13px; cursor:pointer}
  .ed-add:hover{background:var(--raised)}
  .ed-addroom{margin-top:6px}

  /* ---- выбор цвета ---- */
  .cpicker{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
    padding:16px; background:rgba(0,0,0,.62)}
  .cpicker.show{display:flex}
  .cp-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
    width:100%; max-width:340px; padding:14px; display:flex; flex-direction:column; gap:12px}
  .cp-head{display:flex; align-items:center}
  .cp-title{flex:1; font-size:14px; font-weight:600}
  .cp-wheel{position:relative; width:230px; max-width:72vw; aspect-ratio:1; margin:2px auto 0; border-radius:50%;
    cursor:crosshair; touch-action:none; border:1px solid var(--border);
    background:radial-gradient(circle at center,#fff 0%,rgba(255,255,255,0) 68%),
      conic-gradient(#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000)}
  .cp-wheel-cur{position:absolute; width:20px; height:20px; border-radius:50%; border:3px solid #fff;
    box-shadow:0 0 0 1px #0007,0 1px 5px #0008; transform:translate(-50%,-50%); pointer-events:none}
  .cp-val{-webkit-appearance:none; appearance:none; width:100%; height:14px; border-radius:8px; outline:none;
    cursor:pointer; touch-action:none; background:linear-gradient(to right,#000,#fff)}
  .cp-val::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:#fff; border:2px solid #0005; cursor:pointer}
  .cp-val::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid #0005}
  .cp-row{display:flex; align-items:center; gap:10px}
  .cp-preview{width:34px; height:34px; border-radius:9px; border:1px solid var(--border); flex:none}
  .cp-hex{flex:1; font-family:var(--mono); text-transform:uppercase}
  .cp-inputs{display:flex; flex-direction:column; gap:6px; margin-top:8px}
  .cp-in-row{display:flex; align-items:center; gap:6px}
  .cp-in-row span{width:34px; font-size:11px; color:var(--muted); flex:none}
  .cp-in-row input{flex:1; min-width:0; font-family:var(--mono); font-size:13px; text-align:center; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 4px}
  .cp-presets{display:grid; grid-template-columns:repeat(8,1fr); gap:6px}
  .cp-tabs{display:flex; gap:6px; margin:2px 0 10px}
  .cp-tab{flex:1; padding:8px; border-radius:9px; border:1px solid var(--border); background:var(--raised); color:var(--muted); font:inherit; font-size:13px; cursor:pointer}
  .cp-tab.active{background:var(--active); border-color:var(--active); color:var(--on-active); font-weight:600}
  .cp-wrow{display:flex; flex-direction:column; gap:5px; margin-bottom:14px}
  .cp-wlab{font-size:12px; color:var(--muted)}
  .cp-cct{background:linear-gradient(to right,#ff9838,#ffd9a8,#fff,#cfe0ff,#a9c6ff)}
  .cp-cct::-webkit-slider-thumb{background:#fff; border:2px solid #888}
  .cp-cct::-moz-range-thumb{background:#fff; border:2px solid #888}
  .cp-foot{margin-top:6px}
  .cp-foot .ed-btn{width:100%}
  .cp-sw{width:100%; aspect-ratio:1; border-radius:7px; border:1px solid var(--border); cursor:pointer; padding:0}
  .cp-sw:active{transform:scale(.9)}

  /* состояния */
  .empty,.loading{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px}
  .loading .dot{margin:0 auto 14px; width:12px; height:12px}
  footer{text-align:center; color:var(--faint); font-size:11px; padding:22px 0 10px}
  footer .mono{font-family:var(--mono)}
</style>
</head>

<script>
  /* Реестр плагинов-карточек. Определяется ДО движка и до файлов карточек. */
  window.Lovelace = { cards:{}, _rerender:null,
    register:function(t,s){ this.cards[t]=s; if(this._rerender) this._rerender(); },
    util:{
      tru:function(v){ return v==1||v==="1"||v===true||v==="on"||v==="true"; },
      // значение свойства: сперва values[prop] (reads), затем легаси-поле
      V:function(c, prop, legacy){
        if (c.values && prop!=null && Object.prototype.hasOwnProperty.call(c.values, prop)) return c.values[prop];
        return legacy!==undefined ? legacy : c.value;
      },
      // инъекция CSS карточки (стили лежат в файле самой карточки)
      css:function(text){ var s=document.createElement("style"); s.textContent=text; document.head.appendChild(s); }
    } };
</script>

<script>
"use strict";
(function(){
  // ---- настройки -------------------------------------------------------
  var API = new URL("../../api.php/module/lovelace/", location.href).href;   // index.html лежит в templates/lovelace/ -> ../../ = корень сайта
  var POLL_MS = 5000;              // интервал опроса (страховка); при живом WS — реже
  var STALE_MS = 15000;           // нет ответа дольше -> «оффлайн»
  var WS_ENABLE = true;           // живые обновления через WebSocket Majordomo
  var _q = new URLSearchParams(location.search);
  var WS_PORT = _q.get("ws_port") || "8001";           // порт WS из настроек Majordomo (WEBSOCKETS_PORT)
  var WS_PATH = _q.get("ws_path") || "/majordomo";     // путь WS
  var WS_URL = "";                                      // полный адрес (переопределяет всё). Пусто = ws://<хост страницы>:WS_PORT+WS_PATH
  var WS_OFF = _q.get("ws_off") === "1";               // WS отключён в Majordomo
  var IS_ADMIN = _q.get("admin") === "1";              // первичное значение из query; уточняется по API (/settings)
  var MY_UID = _q.get("uid") || "0";
  var TOKEN = _q.get("token") || "";        // токен настенного устройства (киоск-режим)
  var DEV = "";
  try{ DEV = localStorage.getItem("lvl_dev") || ""; }catch(e){}
  function A(p){
    var extra=[];
    if(TOKEN) extra.push("token="+encodeURIComponent(TOKEN));
    else if(DEV) extra.push("dev="+encodeURIComponent(DEV));
    return API + p + (extra.length ? ((p.indexOf("?")<0?"?":"&")+extra.join("&")) : "");
  }
  var WS_DEBUG = false;           // true = логировать входящие WS-сообщения в консоль (для диагностики формата)
  var WS_SUBSCRIBE = '{"action":"Subscribe","data":{"TYPE":"devices","DEVICE_ID":"0"}}';  // подписка на все устройства (протокол Majordomo)

  // ---- состояние -------------------------------------------------------
  var app = document.getElementById("app");
  var banner = document.getElementById("banner");
  var tabsEl = document.getElementById("tabs");
  var hdot = document.getElementById("hdot"), hstat = document.getElementById("hstat");
  var lastOk = 0, usingMock = false, pollTimer = null, inflight = false;
  var wsSock = null, wsConnected = false, wsTimer = null, wsRefreshT = null;
  var wsFails = 0, wsEverConnected = false;

  // ---- темы -------------------------------------------------------------
  var THEMES=[
    {id:"dark",name:"Тёмная",bg:"#10131a",ac:"#ffb454"},
    {id:"light",name:"Светлая",bg:"#f4f6f9",ac:"#e8961f"},
    {id:"midnight",name:"Полночь",bg:"#0d1120",ac:"#8b7cff"},
    {id:"ocean",name:"Океан",bg:"#0a1719",ac:"#2fd8c3"},
    {id:"forest",name:"Лес",bg:"#0c1410",ac:"#4fd18a"},
    {id:"sunset",name:"Закат",bg:"#160f0f",ac:"#ff7a45"},
    {id:"grape",name:"Виноград",bg:"#120e1c",ac:"#c07cff"},
    {id:"paper",name:"Бумага",bg:"#f3efe6",ac:"#c8791e"}
  ];
  var themeBtn=document.getElementById("theme");
  var themeMenu=document.getElementById("thememenu");
  function themeGet(){ try{return localStorage.getItem("lvl_theme")||"dark";}catch(e){return "dark";} }
  var themeSync=false;   // синхронизировать тему через БД (на пользователя)
  function curTheme(){ return document.documentElement.getAttribute("data-theme")||"dark"; }
  function pushPrefs(){ if(typeof edPost==="function") edPost("saveprefs",{prefs:{theme:curTheme(),themeSync:themeSync}}).catch(function(){}); }
  function savePrefs(obj){
    try{ if(obj.theme)localStorage.setItem("lvl_theme",obj.theme); if(obj.lastRoom)localStorage.setItem("lvl_lastroom",obj.lastRoom); }catch(e){}
  }
  function applyTheme(id,persist){
    document.documentElement.setAttribute("data-theme",id);
    var t=THEMES.filter(function(x){return x.id===id;})[0];
    var meta=document.querySelector('meta[name="theme-color"]'); if(meta&&t)meta.setAttribute("content",t.bg);
    if(persist!==false){ savePrefs({theme:id}); if(themeSync) pushPrefs(); }   // включена синхронизация -> в БД
  }
  function buildThemeMenu(){
    var cur=document.documentElement.getAttribute("data-theme")||"dark";
    themeMenu.innerHTML=THEMES.map(function(t){
      return '<button class="tm-item'+(t.id===cur?" active":"")+'" data-theme="'+t.id+'">'
        +'<span class="tm-sw" style="background:'+t.bg+'"><i style="background:'+t.ac+'"></i></span>'+esc(t.name)+'</button>';
    }).join("");
  }
  applyTheme(themeGet(), false);   // мгновенно из кэша, без пересохранения
  themeBtn.addEventListener("click",function(e){
    e.stopPropagation();
    if(themeMenu.classList.contains("show")){themeMenu.classList.remove("show");return;}
    buildThemeMenu(); themeMenu.classList.add("show");
  });
  themeMenu.addEventListener("click",function(e){
    var b=e.target.closest(".tm-item"); if(!b)return;
    applyTheme(b.dataset.theme,true); buildThemeMenu(); themeMenu.classList.remove("show");
  });
  document.addEventListener("click",function(){themeMenu.classList.remove("show");});
  var lastRooms = [], activeRoom = "__all__";   // выбранная комната; __all__ = все
  var hideAllTab = false;                       // скрывать вкладку «Все»
  try{ activeRoom = localStorage.getItem("lvl_lastroom") || "__all__"; }catch(e){}

  // ---- реестр плагинов-карточек (определён в отдельном блоке до движка) --
  var Lovelace = window.Lovelace;
  Lovelace._rerender = function(){ if(lastRooms.length) paint(); };
  var _pluginBinds = {}, _pluginSeq = 0;

  function svg(name){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
      +'stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.dot)+'</svg>';

  // ---- утилиты ---------------------------------------------------------
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function truthy(v){return v==1||v==="1"||v===true||v==="on"||v==="true";}
  function pad(n){return n<10?"0"+n:""+n;}
  function tick(){var d=new Date();document.getElementById("clock").textContent=
    pad(d.getHours())+":"+pad(d.getMinutes());}
  setInterval(tick,10000); tick();

  // ядро api.php оборачивает ответ: {request,apiHandleResult,...}. Разворачиваем.
  function apiJson(r){ return r.json().then(function(j){ return (j && j.apiHandleResult!==undefined) ? j.apiHandleResult : j; }); }
  // ---- сеть ------------------------------------------------------------
  function getState(){
    return fetch(A("state"),{headers:{"Accept":"application/json"},cache:"no-store",credentials:"same-origin"})
      .then(function(r){if(!r.ok)throw 0;return apiJson(r);})
      .then(function(j){if(!j||!j.ok)throw 0;return j;});
  }
  var writesInflight=0;
  function trackWrite(p){ writesInflight++; p.then(function(){writesInflight--;},function(){writesInflight--;}); return p; }
  // При живом WS истинное состояние всё равно придёт пушем и op=state его подтвердит,
  // поэтому неудачный ответ не считаем фатальным — не мигаем ложным «не удалось».
  function softenIfWS(p){ return p.catch(function(err){ if(wsConnected) return {ok:true,soft:true}; throw err; }); }
  function postSet(object,property,value){
    function attempt(){
      return fetch(A("set"),{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({object:object,property:property,value:value})})
        .then(function(r){if(!r.ok)throw 0;return apiJson(r);})
        .then(function(j){if(!j||!j.ok)throw 0;return j;});
    }
    // одна запись = один запрос (без повтора: повтор удваивал висящие connect'ы к недоступному устройству)
    return softenIfWS(trackWrite(attempt()));
  }
  function postMethod(object,method){
    return softenIfWS(trackWrite(fetch(A("method"),{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({object:object,method:method,params:{}})})
      .then(function(r){if(!r.ok)throw 0;return apiJson(r);})
      .then(function(j){if(!j||!j.ok)throw 0;return j;})));
  }

  // ---- рендер ----------------------------------------------------------
  function deviceIsOn(dev){
    return (dev.controls||[]).some(function(c){var p=Lovelace.cards[c.type]; return p&&p.isOn&&p.isOn(c);});
  }

  function render(data){
    lastRooms = data.rooms || [];
    hideAllTab = !!data.hideAllTab;
    var bt=document.getElementById("brand-title");
    if(bt) bt.textContent=(data.title&&String(data.title).trim())?data.title:"Дом";
    buildTabs();
    paint();
  }

  // строим вкладки только когда набор комнат изменился (не сбивая скролл при опросе)
  function buildTabs(){
    if(lastRooms.length<=1){tabsEl.innerHTML=""; tabsEl.dataset.sig=""; return;}
    var first=lastRooms[0].id||lastRooms[0].title;
    if(activeRoom!=="__all__" && !lastRooms.some(function(r){return (r.id||r.title)===activeRoom;})) activeRoom = hideAllTab ? first : "__all__";
    if(hideAllTab && activeRoom==="__all__") activeRoom = first;   // «Все» скрыта — встаём на первую
    var keys=(hideAllTab?"H|":"")+lastRooms.map(function(r){return r.id||r.title;}).join("|");
    if(tabsEl.dataset.sig!==keys){
      var h=hideAllTab?"":('<button class="tab'+(activeRoom==="__all__"?" active":"")+'" data-room="__all__">Все</button>');
      lastRooms.forEach(function(r){
        var key=r.id||r.title;
        h+='<button class="tab'+(activeRoom===key?" active":"")+'" data-room="'+esc(key)+'">'+esc(r.title||r.id)+'</button>';
      });
      tabsEl.innerHTML=h; tabsEl.dataset.sig=keys;
      tabsEl.querySelectorAll(".tab").forEach(function(b){
        b.addEventListener("click",function(){activeRoom=b.dataset.room; savePrefs({lastRoom:activeRoom}); buildTabs(); paint();});
      });
    } else {
      tabsEl.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("active", b.dataset.room===activeRoom);});
    }
    scrollActiveTabIntoView();
  }
  function scrollActiveTabIntoView(){
    var a=tabsEl.querySelector(".tab.active"); if(!a) return;
    var l=a.offsetLeft, r=l+a.offsetWidth;
    if(l < tabsEl.scrollLeft) tabsEl.scrollLeft=l-12;
    else if(r > tabsEl.scrollLeft+tabsEl.clientWidth) tabsEl.scrollLeft=r-tabsEl.clientWidth+12;
  }

  function paint(){
    _pluginBinds={}; _pluginSeq=0;
    if(!lastRooms.length){app.innerHTML='<div class="empty">Нет объектов для отображения.</div>';return;}
    var shown=(activeRoom==="__all__")?lastRooms:lastRooms.filter(function(r){return (r.id||r.title)===activeRoom;});
    var showTitles=(activeRoom==="__all__");   // внутри одной комнаты заголовок дублирует вкладку
    var html="";
    shown.forEach(function(room){
      html+='<section class="room">'+(showTitles?('<h2>'+esc(room.title||room.id)+'</h2>'):'')+'<div class="grid">';
      (room.devices||[]).forEach(function(dev){html+=card(dev);});
      html+='</div></section>';
    });
    app.innerHTML=html;
    app.querySelectorAll(".card-top[data-info]").forEach(function(el){
      el.addEventListener("click",function(){ openCardInfo(el.dataset.info, el.dataset.infoTitle); });
    });
    app.querySelectorAll("[data-lvl-bind]").forEach(function(el){
      var b=_pluginBinds[el.getAttribute("data-lvl-bind")];
      if(b && typeof b.p.bind==="function")
        b.p.bind(el, b.dev, b.c, {postSet:postSet, postMethod:postMethod, flash:flash, refresh:refresh,
          openChart:openChart, openColor:openColor, openWebrtc:openWebrtc, truthy:truthy, normHex:normHex});
    });
    collapseSpacers();
  }

  // распорка нужна только чтобы «добить» остаток строки; если она оказалась
  // в начале строки (мало колонок — перенос уже произошёл), она лишняя — прячем
  function collapseSpacers(){
    app.querySelectorAll(".grid").forEach(function(grid){
      var sps=grid.querySelectorAll(".card.spacer");
      if(!sps.length) return;
      sps.forEach(function(s){ s.style.display=""; });
      var hide=[];
      sps.forEach(function(s){
        var prev=s.previousElementSibling;
        if(!prev || s.offsetTop!==prev.offsetTop) hide.push(s);   // начало строки => лишняя
      });
      hide.forEach(function(s){ s.style.display="none"; });
    });
  }
  var _spTimer;
  window.addEventListener("resize",function(){ clearTimeout(_spTimer); _spTimer=setTimeout(collapseSpacers,150); });

  function card(dev){
    var on=deviceIsOn(dev);
    var wcls={"2":"w2","3":"w3","4":"w4","full":"wfull"}[String(dev.w)]||"";
    var hcls=(dev.h==="2"||dev.h==="tall")?"tall":((dev.h==="3"||dev.h==="xtall")?"xtall":"");
    var sz=(wcls?(" "+wcls):"")+(hcls?(" "+hcls):"");
    if((dev.controls||[]).length && dev.controls[0].type==="spacer")
      return '<div class="card spacer"></div>';   // перенос: заполняет остаток строки (CSS), высота 0
    // карточки без шапки (напр. часы): рендерим только содержимое
    var _ft=(dev.controls&&dev.controls[0])?dev.controls[0].type:"";
    var _p0=Lovelace.cards[_ft];
    if(_p0 && _p0.noHeader){
      var hh='<div class="card'+sz+'"><div class="ctrls">';
      (dev.controls||[]).forEach(function(c){hh+=control(dev,c);});
      return hh+'</div></div>';
    }
    var hasObj=!!dev.id;   // карточки без объекта (напр. webrtc) — без инфо-окна
    var info=hasObj?(' data-info="'+esc(dev.id)+'" data-info-title="'+esc(dev.title||dev.id)+'"'):'';
    var h='<div class="card'+(on?" on":"")+sz+'"><div class="card-top'+(hasObj?"":" no-obj")+'"'+info+'>'
      +'<div class="ico">'+svg(dev.icon)+'</div>'
      +'<div class="titles"><div class="t">'+esc(dev.title||dev.id||"—")+'</div>'
      +(dev.id?'<div class="s">'+esc(dev.id)+'</div>':'')+'</div>'
      +(dev.alive!=null
          ? '<span class="card-alive '+(dev.alive?"on":"off")+'" title="'+(dev.alive?"На связи":"Не в сети")+'"></span>'
          : (hasObj?'<span class="card-i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>':''))
      +'</div><div class="ctrls">';
    (dev.controls||[]).forEach(function(c){h+=control(dev,c);});
    return h+'</div></div>';
  }

  function control(dev,c){
    var lbl=c.label?'<div class="ctrl-label">'+esc(c.label)+'</div>':"";
    var plug=Lovelace.cards[c.type];
    if(plug && typeof plug.render==="function"){
      var cid="lc"+(_pluginSeq++);
      _pluginBinds[cid]={p:plug,dev:dev,c:c};
      var ctx={esc:esc,svg:svg,truthy:truthy,normHex:normHex};
      return lbl+'<div class="ctrl-plugin" data-lvl-bind="'+cid+'">'+plug.render(dev,c,ctx)+'</div>';
    }
    // тип без плагина — простое значение (карточка не «падает»)
    var v=(c.values&&c.prop&&c.values[c.prop]!=null)?c.values[c.prop]:c.value;
    return lbl+'<div class="textv">'+esc(v==null?"":v)+esc(c.unit?" "+c.unit:"")+'</div>';
  }

  // ---- вспомогательное ------------------------------------------------
  function normHex(v){
    if(v==null) return "";
    v=String(v).trim();
    if(/^#?[0-9a-fA-F]{6}$/.test(v)) return v.charAt(0)==="#"?v:"#"+v;
    var m=v.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if(m){var h=function(n){n=Math.max(0,Math.min(255,parseInt(n,10)));return ("0"+n.toString(16)).slice(-2);};
      return "#"+h(m[1])+h(m[2])+h(m[3]);}
    return "";
  }

  function flash(msg){banner.textContent=msg;banner.classList.add("show");
    clearTimeout(flash._t);flash._t=setTimeout(function(){if(!usingMock)banner.classList.remove("show");},3500);}

  // ---- УВЕДОМЛЕНИЯ из shoutbox (только в отдельном окне, чтобы не дублировать родную страницу) ----
  var toastsEl=document.getElementById("toasts");
  function showToast(who, text, tm){
    if(!toastsEl) return;
    var el=document.createElement("div"); el.className="toast";
    el.innerHTML='<div class="t-head"><span class="t-who">'+esc(who||"")+'</span><span class="t-time">'+esc(tm||"")+'</span></div><div class="t-text">'+esc(text||"")+'</div>';
    toastsEl.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("show"); });
    setTimeout(function(){ el.classList.remove("show"); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 250); }, 6500);
    while(toastsEl.children.length>4) toastsEl.removeChild(toastsEl.firstChild);
  }
  var noteStandalone = (window.self===window.top);   // отдельное окно (не iframe родной страницы)
  var noteSeen = null;                               // ключ верхней (свежей) записи прошлого опроса
  var noteInit = false;                              // первый опрос — запоминаем молча
  function parseShout(html){
    // <span>ВРЕМЯ <b>АВТОР</b>: ТЕКСТ</span> — вернуть массив свежие->старые
    var out=[], re=/<span>\s*([0-9:]+)\s*<b>(.*?)<\/b>\s*:\s*([\s\S]*?)<\/span>/g, m;
    while((m=re.exec(html))){
      var text=m[3].replace(/<[^>]+>/g,"").replace(/&lt;#[^>]*#&gt;/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").trim();
      out.push({tm:m[1], who:m[2].replace(/<[^>]+>/g,"").trim(), text:text, key:m[1]+"|"+text});
    }
    return out;
  }
  function pollShout(){
    if(!noteStandalone || TOKEN) return;                 // в iframe/kiosk — не показываем
    if(document.visibilityState==="hidden") return;
    fetch("/popup/shoutbox.html?&limit=10&getdata=1&reverse=1",{cache:"no-store",credentials:"same-origin"})
      .then(function(r){return r.text();}).then(function(html){
        var list=parseShout(html); if(!list.length) return;
        if(!noteInit){ noteInit=true; noteSeen=list[0].key; return; }   // первый опрос — молча
        // показываем всё новее прошлой верхушки (list идёт свежие->старые)
        var fresh=[];
        for(var i=0;i<list.length;i++){ if(list[i].key===noteSeen) break; fresh.push(list[i]); }
        noteSeen=list[0].key;
        if(chatOpen) return;   // окно чата открыто — сообщения видны в ленте, тосты не нужны
        fresh.reverse().forEach(function(n){ showToast(n.who, n.text, n.tm); });
        chatUnread += fresh.length; updateBell();   // бейдж непрочитанных
      }).catch(function(){});
  }
  // ---- ЧАТ/СООБЩЕНИЯ (колокольчик): история shoutbox + отправка (msg=) ----
  var chatEl=document.getElementById("chatModal");
  var chatListEl=document.getElementById("chat-list");
  var chatOpen=false, chatUnread=0, chatPoll=null;
  function updateBell(){
    var b=document.getElementById("bell-badge"); if(!b) return;
    if(chatUnread>0){ b.textContent=chatUnread>99?"99+":String(chatUnread); b.style.display=""; }
    else b.style.display="none";
  }
  function renderChat(list, forceScroll){
    if(!chatListEl) return;
    if(!list.length){ chatListEl.innerHTML='<div class="chat-empty">Нет сообщений</div>'; return; }
    // держались ли внизу до перерисовки (порог 40px)
    var atBottom = (chatListEl.scrollHeight - chatListEl.scrollTop - chatListEl.clientHeight) < 40;
    var html=list.slice().reverse().map(function(n){
      return '<div class="chat-msg"><div class="cm-head"><span class="cm-who">'+esc(n.who)+'</span> · '+esc(n.tm)+'</div><div class="cm-text">'+esc(n.text)+'</div></div>';
    }).join("");
    chatListEl.innerHTML=html;
    if(forceScroll || atBottom) chatListEl.scrollTop=chatListEl.scrollHeight;   // скроллим только если были внизу/принудительно
  }
  function loadChat(forceScroll){
    fetch("/popup/shoutbox.html?&limit=30&getdata=1&reverse=1",{cache:"no-store",credentials:"same-origin"})
      .then(function(r){return r.text();}).then(function(html){
        var list=parseShout(html);
        renderChat(list, forceScroll);
        if(list.length){ noteSeen=list[0].key; noteInit=true; }   // синхронизируем с тостами
      }).catch(function(){ if(chatListEl) chatListEl.innerHTML='<div class="chat-empty">Не удалось загрузить</div>'; });
  }
  function openChatBox(){
    if(!chatEl) return;
    chatOpen=true; chatUnread=0; updateBell();
    // поле ввода — только при сессии (не kiosk)
    var inp=document.getElementById("chat-input");
    if(inp) inp.style.display = TOKEN ? "none" : "flex";
    chatEl.classList.add("show"); updateScrollLock();
    loadChat(true);                          // при открытии — вниз
    chatPoll=setInterval(function(){ loadChat(false); }, 5000);   // фон — без прыжка вниз
  }
  function closeChatBox(){
    chatOpen=false;
    if(chatEl) chatEl.classList.remove("show");
    if(chatPoll){ clearInterval(chatPoll); chatPoll=null; }
    updateScrollLock();
  }
  function sendChat(){
    var t=document.getElementById("chat-text"); if(!t) return;
    var msg=t.value.trim(); if(!msg) return;
    t.value="";
    fetch("/popup/shoutbox.html?msg="+encodeURIComponent(msg)+"&getdata=1&reverse=1&limit=30",{cache:"no-store",credentials:"same-origin"})
      .then(function(r){return r.text();}).then(function(html){
        var list=parseShout(html);
        renderChat(list, true);
        if(list.length){ noteSeen=list[0].key; noteInit=true; }   // не всплывать тостом на своё же сообщение
      }).catch(function(){});
  }

  // ---- график по тапу на сенсор (штатный pChart Majordomo) -------------
  var chartTarget=null, chartRange="24h";
  var INFO_POLL_MS=5000;
  var cmodal=document.getElementById("cmodal");
  var cframe=document.getElementById("cmodal-frame");
  var ctitle=document.getElementById("cmodal-title");
  function chartUrl(p,range){return "/pChart/?p="+encodeURIComponent(p)+"&op=log&subop="+range+"&minimal=1";}
  function openChart(p,title){
    chartTarget=p; ctitle.textContent=title||p;
    cframe.src=chartUrl(p,chartRange);
    cmodal.classList.add("show"); updateScrollLock();
  }
  function closeChart(){
    cmodal.classList.remove("show"); cframe.src="about:blank"; chartTarget=null; updateScrollLock();
  }
  document.getElementById("cmodal-ranges").addEventListener("click",function(e){
    var b=e.target.closest(".crange"); if(!b)return;
    chartRange=b.dataset.range;
    this.querySelectorAll(".crange").forEach(function(x){x.classList.toggle("active",x===b);});
    if(chartTarget) cframe.src=chartUrl(chartTarget,chartRange);
  });
  document.getElementById("cmodal-close").addEventListener("click",closeChart);

  // «Домашний» хост: приватные диапазоны, loopback, .local, localhost -> используем авто-адрес WS.
  function isHomeHost(){
    var h=(location.hostname||"").toLowerCase();
    if(h==="localhost"||h==="127.0.0.1"||h==="::1") return true;
    if(/\.local$/.test(h)) return true;
    if(/^10\./.test(h)) return true;
    if(/^192\.168\./.test(h)) return true;
    if(/^172\.(1[6-9]|2\d|3[01])\./.test(h)) return true;   // 172.16.0.0 – 172.31.255.255
    if(/^169\.254\./.test(h)) return true;                   // link-local

    return false;
  }

  function initWS(){
    if(WS_OFF || !WS_ENABLE || !("WebSocket" in window)) return;   // WS_OFF = отключён в настройках Majordomo
    var proto=(location.protocol==="https:")?"wss:":"ws:";
    var url=WS_URL || (proto+"//"+location.hostname+":"+WS_PORT+WS_PATH);
    try{ wsSock=new WebSocket(url); }catch(e){ return; }
    wsSock.onopen=function(){ wsConnected=true; wsEverConnected=true; wsFails=0; if(wsTimer){clearTimeout(wsTimer);wsTimer=null;}
      if(WS_DEBUG){ try{ console.log("[WS] открыт:", url); }catch(e){} }
      if(WS_SUBSCRIBE){ try{ wsSock.send(WS_SUBSCRIBE); if(WS_DEBUG) console.log("[WS] отправлена подписка:", WS_SUBSCRIBE); }catch(e){} }

      var s=(typeof d==="string")?d:"";

      if(s.indexOf('"action":"subscribed"')>=0) return;                // подтверждение подписки — не обновляемся

  function flattenCard(devId,devTitle,devIcon,ctrl){
    var c={object:devId,title:devTitle||"",icon:devIcon||"dot",type:ctrl.type||"sensor"};
    var plug=Lovelace.cards[ctrl.type];
    if(plug && plug.fields) plug.fields.forEach(function(fl){ if(ctrl[fl.k]!=null) c[fl.k]=ctrl[fl.k]; });
    // совместимость: старый формат шторы (nested actions) -> плоские m_*
    if(ctrl.actions){
      if(ctrl.actions.open)c.m_open=ctrl.actions.open.method;
      if(ctrl.actions.stop)c.m_stop=ctrl.actions.stop.method;
      if(ctrl.actions.close)c.m_close=ctrl.actions.close.method;
    }
    return c;
  }
  function configToModel(cfg){

      (r.devices||[]).forEach(function(d){(d.controls||[]).forEach(function(ct){var card=flattenCard(d.id,d.title,d.icon,ct); if(d.w!=null)card.w=String(d.w); if(d.h!=null)card.h=(d.h==="tall"?"2":(d.h==="xtall"?"3":String(d.h))); cards.push(card);});});
      rooms.push({id:r.id||("room"+Math.random().toString(36).slice(2,7)),title:r.title||"",cards:cards});
    });
    return {title:(cfg.title||""), hideAll:!!cfg.hideAllTab, rooms:rooms};

  function cardToDevice(c){
    var plug=Lovelace.cards[c.type];
    var pctrl={type:c.type};
    if(plug){
      (plug.fields||[]).forEach(function(fl){ if(c[fl.k]!=null&&c[fl.k]!=="") pctrl[fl.k]=(fl.t==="num"?num(c[fl.k]):c[fl.k]); });
      if(plug.reads)   pctrl.reads  =(typeof plug.reads==="function")  ?plug.reads(c)  :plug.reads;
      if(plug.writes)  pctrl.writes =(typeof plug.writes==="function") ?plug.writes(c) :plug.writes;
      if(plug.methods) pctrl.methods=(typeof plug.methods==="function")?plug.methods(c):plug.methods;
    }
    var dev={id:c.object||"",title:c.title||"",icon:c.icon||"dot",controls:[pctrl]};
    if(c.w && c.w!=="1") dev.w=c.w;   // "2".."4" | "full"
    if(c.h && c.h!=="1") dev.h=c.h;   // "2" | "3"

  function fieldsFor(type){

      {k:"w",l:"Ширина",t:"seg",o:["1","2","3","4","full"]},{k:"h",l:"Высота",t:"seg",o:["1","2","3"]}];
    var plug=Lovelace.cards[type];
    if(plug && plug.fields) return f.concat(plug.fields);

  // авто-раскладка: добавляет недостающие комнаты/устройства, не стирая правку
  function mergeDiscovered(discRooms){
    (discRooms||[]).forEach(function(dr){
      var room=null;
      for(var i=0;i<edModel.rooms.length;i++){
        if((edModel.rooms[i].title||"").toLowerCase()===(dr.title||"").toLowerCase()){room=edModel.rooms[i];break;}
      }
      if(!room){ room={id:dr.id||("room"+Date.now()+Math.random().toString(36).slice(2,5)),title:dr.title||"",cards:[]}; edModel.rooms.push(room); }
      (dr.devices||[]).forEach(function(d){
        (d.controls||[]).forEach(function(ct){
          var card=flattenCard(d.id,d.title,d.icon,ct);
          var dup=room.cards.some(function(c){return c.object===card.object && c.type===card.type && c.prop===card.prop;});
          if(!dup) room.cards.push(card);
        });
      });
    });
  }
  function doAutoLayout(){
    if(!confirm("Добавить недостающие комнаты и устройства из авто-обнаружения Majordomo? Текущие карточки не удаляются.")) return;
    edApi("discover").then(function(j){
      if(!j||!j.ok){ flash((j&&j.error)?j.error:"Авто-обнаружение недоступно"); return; }
      mergeDiscovered(j.rooms||[]);
      if(edRoomIdx>=edModel.rooms.length) edRoomIdx=0;
      renderEditor();
    }).catch(function(){ flash("Ошибка авто-обнаружения"); });
  }

  function copyText(txt,btn){
    var done=function(){ if(btn){ var o=btn.textContent; btn.textContent="✓"; setTimeout(function(){btn.textContent=o;},1200);} };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ prompt("Скопируйте ссылку:",txt); }); }
    else { prompt("Скопируйте ссылку:",txt); }
  }
  function wireEditor(){

      el.addEventListener("change",function(){
        var ci=+el.closest(".ed-card").dataset.ci;
        var card=edModel.rooms[edRoomIdx].cards[ci];
        card[el.dataset.f]=el.value;
        if(el.dataset.f==="object"||el.dataset.f==="type") renderEditor();
      });
    });
    edBody.querySelectorAll(".ed-seg").forEach(function(seg){
      var f=seg.dataset.f;
      seg.querySelectorAll(".ed-segbtn").forEach(function(btn){
        btn.addEventListener("click",function(){
          var ci=+btn.closest(".ed-card").dataset.ci;
          edModel.rooms[edRoomIdx].cards[ci][f]=btn.dataset.val;
          seg.querySelectorAll(".ed-segbtn").forEach(function(x){x.classList.toggle("active",x===btn);});
        });
      });
    });
    edBody.querySelectorAll(".ed-multi").forEach(function(seg){
      var f=seg.dataset.f;
      seg.querySelectorAll(".ed-segbtn").forEach(function(btn){
        btn.addEventListener("click",function(){
          var ci=+btn.closest(".ed-card").dataset.ci, card=edModel.rooms[edRoomIdx].cards[ci];
          var arr=(card[f]?String(card[f]).split(","):[]).filter(Boolean);
          var v=btn.dataset.val, i=arr.indexOf(v);
          if(i>=0) arr.splice(i,1); else arr.push(v);
          card[f]=arr.join(",");
          btn.classList.toggle("active");
        });
      });
    });
    edBody.querySelectorAll(".ed-moveto").forEach(function(msel){
      msel.addEventListener("change",function(){
        var target=parseInt(msel.value,10); if(isNaN(target))return;
        var ci=+msel.dataset.ci;
        var card=edModel.rooms[edRoomIdx].cards.splice(ci,1)[0];
        if(card) edModel.rooms[target].cards.push(card);
        renderEditor();
      });
    });
    edBody.querySelectorAll("[data-act]").forEach(function(btn){
      btn.addEventListener("click",function(){
        var act=btn.dataset.act, cardEl=btn.closest(".ed-card");
        var ci=cardEl?+cardEl.dataset.ci:-1, room=edModel.rooms[edRoomIdx];
        if(act==="auto"){ doAutoLayout(); return; }
        if(act==="rleft"){ if(edRoomIdx>0){ swap(edModel.rooms,edRoomIdx,edRoomIdx-1); edRoomIdx--; } else return; }
        else if(act==="rright"){ if(edRoomIdx<edModel.rooms.length-1){ swap(edModel.rooms,edRoomIdx,edRoomIdx+1); edRoomIdx++; } else return; }
        else if(act==="radd"){ edModel.rooms.push({id:"room"+Date.now(),title:"Новая комната",cards:[]}); edRoomIdx=edModel.rooms.length-1; }
        else if(act==="rdel"){ if(confirm("Удалить комнату «"+(room?room.title:"")+"» со всеми карточками?")){ edModel.rooms.splice(edRoomIdx,1); edRoomIdx=Math.max(0,edRoomIdx-1); } else return; }
        else if(act==="cadd") room.cards.push({object:"",type:"switch",title:"",icon:"dot"});
        else if(act==="cdel") room.cards.splice(ci,1);
        else if(act==="ccopy"){ edClipboard=JSON.parse(JSON.stringify(room.cards[ci])); renderEditor(); return; }
        else if(act==="cpaste"){ if(!edClipboard) return; room.cards.splice(ci+1,0,JSON.parse(JSON.stringify(edClipboard))); }
        else if(act==="cup"&&ci>0) swap(room.cards,ci,ci-1);
        else if(act==="cdown"&&ci<room.cards.length-1) swap(room.cards,ci,ci+1);
        else return;
        renderEditor();
      });
    });
  }

  function openEditor(){ edTargetUser=MY_UID; loadEditor(); }
  function loadEditor(){
    edEl.classList.add("show"); updateScrollLock();
    edBody.innerHTML='<div class="loading"><div class="dot live"></div>Загрузка…</div>';
    var reqs=[edApi("config","&user="+encodeURIComponent(edTargetUser)),edApi("objects")];
    if(IS_ADMIN){ reqs.push(edApi("settings")); reqs.push(edApi("users")); }
    Promise.all(reqs).then(function(res){
      var cfg=(res[0]&&res[0].ok&&res[0].config)?res[0].config:{rooms:[]};
      edObjects=(res[1]&&res[1].ok&&res[1].objects)?res[1].objects:[];
      if(IS_ADMIN && res[2] && res[2].ok) wsCfgUrl=res[2].ws_url||"";
      if(IS_ADMIN && res[3] && res[3].ok && res[3].users) edUsers=res[3].users;
      edModel=configToModel(cfg);
      edRoomIdx=0;   // открыть ту комнату, что выбрана в панели
      if(activeRoom && activeRoom!=="__all__"){
        for(var i=0;i<edModel.rooms.length;i++){ if((edModel.rooms[i].id||edModel.rooms[i].title)===activeRoom){edRoomIdx=i;break;} }
      }
      renderEditor();
    }).catch(function(){edBody.innerHTML='<div class="empty">Не удалось загрузить. Нужны SQLSelect и доступ к API.</div>';});
  }
  function closeEditor(){edEl.classList.remove("show"); updateScrollLock();}
  if(TOKEN){ var _eb=document.getElementById("edit"); if(_eb) _eb.style.display="none";
             var _sb=document.getElementById("settings"); if(_sb) _sb.style.display="none"; }   // киоск: без редактора и настроек
  document.getElementById("edit").addEventListener("click",openEditor);
  document.getElementById("settings").addEventListener("click",openSettings);
  (function(){
    var bell=document.getElementById("bell"); if(bell) bell.addEventListener("click",openChatBox);
    var cc=document.getElementById("chat-close"); if(cc) cc.addEventListener("click",closeChatBox);
    var cs=document.getElementById("chat-send"); if(cs) cs.addEventListener("click",sendChat);
    var ct=document.getElementById("chat-text"); if(ct) ct.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); sendChat(); } });
    if(chatEl) chatEl.addEventListener("click",function(e){ if(e.target===chatEl) closeChatBox(); });
  }());
  document.getElementById("set-close").addEventListener("click",closeSettings);
  document.getElementById("set-save").addEventListener("click",saveSettings);
  document.getElementById("ed-close").addEventListener("click",closeEditor);

  // ---- экспорт/импорт раскладки ----
  document.getElementById("ed-export").addEventListener("click",function(){
    var cfg=modelToConfig(edModel);
    var blob=new Blob([JSON.stringify(cfg,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    var stamp=new Date().toISOString().slice(0,10);
    a.href=url; a.download="lovelace-layout-"+stamp+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  });
  document.getElementById("ed-import").addEventListener("click",function(){
    document.getElementById("ed-file").value=""; document.getElementById("ed-file").click();
  });
  document.getElementById("ed-file").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var cfg; try{ cfg=JSON.parse(rd.result); }catch(err){ flash("Не удалось прочитать файл (не JSON)"); return; }
      if(!cfg||!Array.isArray(cfg.rooms)){ flash("Это не похоже на раскладку (нет rooms)"); return; }
      edModel=configToModel(cfg); edRoomIdx=0; renderEditor();
      flash("Раскладка загружена — проверьте и нажмите «Сохранить»");
    };
    rd.onerror=function(){ flash("Ошибка чтения файла"); };
    rd.readAsText(f);
  });

  document.getElementById("ed-save").addEventListener("click",function(){
    edSave(modelToConfig(edModel)).then(function(j){
      if(j&&j.ok){closeEditor(); refresh();}
      else flash((j&&j.error)?j.error:"Не удалось сохранить");
    }).catch(function(){flash("Ошибка сохранения");});
  });

  // ======================================================================
  //  ДЕМО-ДАННЫЕ  (показываются только когда API недоступен)
  // ======================================================================
  var MOCK={ok:true,ts:0,rooms:[
    {id:"living",title:"Гостиная",devices:[
      {id:"HallLamp",title:"Люстра",icon:"bulb",controls:[{prop:"status",type:"switch",value:1}]},
      {id:"HallDim",title:"Подсветка",icon:"bulb",controls:[{prop:"level",type:"slider",value:40,unit:"%",min:0,max:100,step:5}]},
      {id:"HallTemp",title:"Температура",icon:"thermo",controls:[{prop:"value",type:"sensor",value:23.4,unit:"°C"}]},
      {id:"HallMotion",title:"Движение",icon:"motion",controls:[{prop:"status",type:"text",value:"Тихо"}]}
    ]},
    {id:"kitchen",title:"Кухня",devices:[
      {id:"KitLight",title:"Свет",icon:"bulb",controls:[{prop:"status",type:"switch",value:0}]},
      {id:"KitHum",title:"Влажность",icon:"droplet",controls:[{prop:"value",type:"sensor",value:48,unit:"%"}]},
      {id:"Kettle",title:"Чайник",icon:"power",controls:[{prop:"status",type:"switch",value:0},{prop:"boil",label:"Действие",type:"button",method:"boil",label:"Вскипятить"}]}
    ]},
    {id:"bedroom",title:"Спальня",devices:[
      {id:"BedLamp",title:"Ночник",icon:"bulb",controls:[{prop:"status",type:"switch",value:0}]},
      {id:"BedTemp",title:"Температура",icon:"thermo",controls:[{prop:"value",type:"sensor",value:21.8,unit:"°C"}]}
    ]}
  ]};
  function mockSet(obj,prop,val){
    MOCK.rooms.forEach(function(r){r.devices.forEach(function(d){
      if(d.id===obj)d.controls.forEach(function(c){if(c.prop===prop)c.value=val;});});});
  }
})();
</script>
